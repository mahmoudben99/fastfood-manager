name: Build TV APK

on:
  push:
    branches: ["feature/ambient-tv-overhaul"]
    paths:
      - "tv-app/**"
      - ".github/workflows/build-tv-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper (8.7)
        working-directory: tv-app
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: tv-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastfood-tv-apk
          path: tv-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
