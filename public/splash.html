<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* v4 "Ember" splash: 58 KB JPEG (was a 5 MB PNG), compositor-only motion, reduced-motion aware. */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: transparent; }

    body {
      width: 900px;
      height: 600px;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* The picture lives on .frame (not body): a body background propagates to the whole
       transparent window and the rounded corners never showed. */
    .frame {
      position: relative;
      width: 900px;
      height: 600px;
      overflow: hidden;
      border-radius: 22px;
      background: #7a1d0b url('./splash-bg.jpg') center / cover no-repeat;
    }

    /* Warm vignette so the name stays legible on the busy photo */
    .frame::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(60% 45% at 50% 58%, rgba(40, 12, 4, 0.35), transparent 70%),
        linear-gradient(180deg, rgba(28, 10, 4, 0) 45%, rgba(28, 10, 4, 0.55) 100%);
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 150px 56px 0;
    }

    .restaurant-name {
      font-size: 68px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -1.5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.35), 0 10px 30px rgba(60, 15, 0, 0.45);
      opacity: 0;
      transform: translateY(14px) scale(0.98);
      animation: rise 700ms cubic-bezier(0.22, 1, 0.36, 1) 250ms forwards;
      max-width: 780px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tagline {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(20, 8, 3, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: rgba(255, 255, 255, 0.92);
      opacity: 0;
      animation: fade 600ms ease-out 700ms forwards;
    }

    .tagline .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffb27c;
      box-shadow: 0 0 10px #ff8c45;
    }

    .progress {
      position: absolute;
      left: 50%;
      bottom: 38px;
      width: 220px;
      height: 4px;
      margin-left: -110px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      overflow: hidden;
      z-index: 1;
    }

    .progress::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffd2ae, #ffffff);
      transform-origin: left center;
      transform: scaleX(0);
      animation: load 4.6s cubic-bezier(0.3, 0.6, 0.2, 1) 200ms forwards;
    }

    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes load { to { transform: scaleX(1); } }

    @media (prefers-reduced-motion: reduce) {
      .restaurant-name, .tagline { animation: none; opacity: 1; transform: none; }
      .progress::after { animation: none; transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="container">
      <div class="restaurant-name" id="restaurantName" dir="auto">FFM</div>
      <div class="tagline"><span class="dot"></span><span>Fast Food Manager</span></div>
    </div>
    <div class="progress" aria-hidden="true"></div>
  </div>

  <script>
    async function loadSplash() {
      try {
        const settings = await window.electronAPI?.invoke('settings:getAll');
        const restaurantName = settings?.restaurant_name || 'My Restaurant';
        document.getElementById('restaurantName').textContent = restaurantName;
      } catch (err) {
        console.error('Failed to load splash:', err);
      }
    }

    loadSplash();

    setTimeout(() => {
      if (window.electronAPI?.invoke) {
        window.electronAPI.invoke('splash:close');
      }
    }, 5000);
  </script>
</body>
</html>
